
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Teacher Management Portal App</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      max-width: 600px;
      margin: auto;
      background: white;
    }

    .app-header {
      background: #111827;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .app-header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .app-header p {
      font-size: 13px;
      opacity: 0.75;
    }

    .app-content {
      padding: 25px 20px;
    }

    .welcome {
      text-align: center;
      padding: 40px 20px;
    }

    .welcome-icon {
      font-size: 55px;
      margin-bottom: 18px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #6b7280;
      line-height: 1.6;
    }
  </style>

  <link rel="manifest" href="./manifest.json">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
  const SUPABASE_URL = 'https://ifaptabszmvxgaltmrnh.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_XWdNI0Jix2_TGMVOAfYjA_bADlqGpq';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
</script>
  
  </head>

<body>

  <div class="app">

    <header class="app-header">
      <h1>Teacher Management Portal App</h1>
      <p>Teacher Management System</p>
    </header>

    <main class="app-content">

<section class="login-section">

  <div class="login-icon">👨‍🏫</div>

  <h2>Teacher Login</h2>

  <p class="login-subtitle">
    Sign in to your Teacher Management Portal
  </p>

  <form id="loginForm">

    <label for="loginEmail">Email Address</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      required
    >

    <label for="loginPassword">Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
      required
    >

    <button type="submit" id="loginButton">
      Login
    </button>

    <p id="loginMessage"></p>

  </form>

</section>

    </main>

  </div>

<script>
  console.log(
    'Supabase connected:',
    typeof supabaseClient !== 'undefined'
  );
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(error => {
          console.error('Service Worker registration failed:', error);
        });
    });
  }
</script>

</body>
</html>
